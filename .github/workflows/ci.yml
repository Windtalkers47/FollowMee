name: FollowMee CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: followmee_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      JWT_SECRET: ci-only-secret-that-is-longer-than-thirty-two-characters
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_NAME: followmee_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            Backend/package-lock.json
            Frontend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix Backend
      - run: npm ci --prefix Frontend
      - run: npm run verify
      - run: npm run e2e:db:reset
      - run: npm run test:integration:seeded
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:db:reset
      - name: Critical browser and authorization paths
        run: npx playwright test e2e/authenticated.spec.ts e2e/resource-authorization.spec.ts e2e/workflows.spec.ts e2e/profile-conversion.spec.ts e2e/uat-readiness.spec.ts --project=chromium-desktop --workers=1
        env:
          E2E_SEEDED: '1'
          E2E_BASE_URL: http://localhost:5175
