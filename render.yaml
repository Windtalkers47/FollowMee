# Render Deployment Configuration
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # Backend Service
  - type: web
    name: followmee-backend
    env: node
    region: oregon
    plan: free
    branch: main
    rootDir: Backend
    buildCommand: npm ci && npm run build
    startCommand: npm run migration:run:prod && npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REWARD_DEV_SEED
        value: "false"
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: true
      - key: DB_SSL_CA_BASE64
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CORS_PREVIEW_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
